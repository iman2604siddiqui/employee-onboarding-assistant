<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Settings</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <h1>Employee Settings</h1>
    <p class="intro">
      Enter your details below. This form checks them in the browser only.
      It does not store employee data in a database.
    </p>

    <form id="employee-settings-form" novalidate>
      <div class="field">
        <label for="full-name">Full Name</label>
        <input
          id="full-name"
          name="fullName"
          type="text"
          autocomplete="name"
          required
          aria-describedby="full-name-error"
        >
        <p id="full-name-error" class="error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="work-email">Work Email</label>
        <input
          id="work-email"
          name="workEmail"
          type="email"
          autocomplete="email"
          inputmode="email"
          required
          aria-describedby="work-email-error"
        >
        <p id="work-email-error" class="error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="department">Department</label>
        <select
          id="department"
          name="department"
          required
          aria-describedby="department-error"
        >
          <option value="">Select a department</option>
          <option value="HR">HR</option>
          <option value="IT">IT</option>
          <option value="Marketing">Marketing</option>
          <option value="Finance">Finance</option>
        </select>
        <p id="department-error" class="error" aria-live="polite"></p>
      </div>

      <button type="submit">Save settings</button>
    </form>

    <p id="confirmation" class="confirmation" role="status" aria-live="polite"></p>
  </main>
  <script src="settings.js"></script>
</body>
</html>
